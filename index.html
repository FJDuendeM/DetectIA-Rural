<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌾 DetectIA Rural</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ========================= -->
<!-- PANTALLA DE INICIO -->
<!-- ========================= -->

<div id="inicio">

    <h1>🌾 DetectIA Rural</h1>

    <p>
        ¿Podés descubrir si las siguientes imágenes y videos
        son hechos por una cámara o generados con Inteligencia Artificial?
    </p>


    <input
        type="text"
        id="nombreJugador"
        placeholder="Ingrese su nombre"
        maxlength="20"
        autocomplete="off">


    <br><br>


    <button onclick="comenzar()">
        COMENZAR
    </button>


</div>



<!-- ========================= -->
<!-- JUEGO -->
<!-- ========================= -->


<div id="juego" style="display:none;">


    <h2 id="contador"></h2>


    <div id="contenido"></div>


    <br>


    <div id="botones">


        <button class="real" onclick="responder('REAL')">
            📷 REAL
        </button>


        <button class="ia" onclick="responder('IA')">
            🤖 IA
        </button>


    </div>


    <h2 id="mensaje"></h2>


</div>




<!-- ========================= -->
<!-- FINAL -->
<!-- ========================= -->


<div id="final" style="display:none;">


    <h1>🎉 Juego terminado</h1>


    <h2 id="puntaje"></h2>


    <h3 id="puesto"></h3>


    <hr>


    <h2>🏆 TOP 10</h2>


    <div id="ranking"></div>


    <br>


    <button onclick="comenzar()">
        🔄 Jugar otra vez
    </button>


    <button onclick="nuevoJugador()">
        👤 Nuevo jugador
    </button>


    <button onclick="exportarRanking()">
        📥 Exportar ranking
    </button>


    <button onclick="document.getElementById('archivoRanking').click()">
        📤 Importar ranking
    </button>


    <button onclick="reiniciarRanking()">
        🗑️ Reiniciar ranking
    </button>



    <input
        type="file"
        id="archivoRanking"
        accept=".json"
        style="display:none;">


</div>



<!-- JAVASCRIPT -->
<script src="script.js"></script>


</body>

</html>
